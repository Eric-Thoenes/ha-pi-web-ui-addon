name: Pi UI
version: 0.76.6
slug: pi_web_ui_agent
description: >-
  Web UI del coding agent Pi, istanza indipendente con ingress HA.
  Include pi-coding-agent con sessioni, skills e workspace propri
  in /data. Accessibile dalla sidebar di Home Assistant.
icon: icon.svg
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 3000
webui: http://[HOST]:[PORT:3000]
host_network: false
ports:
  8888/tcp: null
ports_description:
  8888/tcp: Porta interna del server pi-web-ui (proxy ingress su :3000)