name: Pi Web UI — istanza autonoma
version: 0.76.0
slug: pi_web_ui_agent
description: >-
  Web UI del coding agent Pi (pi-web-ui) come istanza indipendente,
  accessibile via ingress Home Assistant. Include il pi-coding-agent
  come dipendenza: sessioni e skills propri in /data.
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 3000
webui: http://[HOST]:[PORT:3000]
host_network: false
ports:
  8888/tcp: null
ports_description:
  8888/tcp: Porta interna del server pi-web-ui (proxy ingress su :3000)